<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E17" />
  <meta name="description" content="Captura y organiza productos en ferias comerciales. Escanea tarjetas, fotos, notas de voz y calcula costos de importacion con IA." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FairScan" />
  <meta property="og:title" content="FairScan — Escaner de ferias comerciales" />
  <meta property="og:description" content="Captura productos, proveedores y calcula costos de importacion con IA. PWA offline-first para ferias en China." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icon-512.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- DM Sans viaja dentro del paquete (src/styles/fonts.css); antes venía de Google Fonts -->
  <link rel="stylesheet" href="/src/styles/fonts.css" />
  <title>FairScan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body { height: 100%; min-height: 100%; min-height: 100dvh; overflow: hidden; font-family: 'DM Sans', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: #0A0E17; }
    #root { height: 100%; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
    /* En computadora (Nati, 22/09: "hay que pensar la adaptación"): lo que en el teléfono ocupa la pantalla
       entera se acota a un ancho de teléfono, centrado, sobre fondo oscuro. Es el mínimo para que una ficha
       no sea una foto gigante; la adaptación de verdad se decide con wireframe. */
    /* Tablet en vertical: la app del teléfono acotada. De 900 px en adelante aparece el escritorio (23/09). */
    @media (min-width: 760px) and (max-width: 899px) {
      body { background: #0B0E17; }
      #root { max-width: 460px; margin: 0 auto; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
      .pantalla-fija { left: 50% !important; right: auto !important; width: 460px !important; transform: translateX(-50%); }
    }
    ::-webkit-scrollbar { width: 0; height: 0; }
    /* Hide scrollbar for swipeable photo carousel */
    div[style*="scroll-snap-type"]::-webkit-scrollbar { display: none; }
    input, select, button, textarea { font-family: inherit; font-size: 16px; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* Fix iOS standalone PWA safe area */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .safe-bottom { padding-bottom: calc(16px + env(safe-area-inset-bottom)) !important; }
    }
    /* Que no se sienta una página web adentro de una app (propuesta-experiencia.md §7) */
    html { touch-action: manipulation; overscroll-behavior: none; }          /* sin retraso de 300 ms al tocar; sin rebote de página */
    body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; } /* mantener apretado no abre "copiar" */
    input, textarea, [contenteditable="true"], .seleccionable { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
    @keyframes fsLatido { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease both; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 15px rgba(239,68,68,0); } }
    @keyframes aiSyncPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.8); } }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading skeleton (replaced by React on mount) -->
    <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0A0E17;font-family:'DM Sans',-apple-system,sans-serif">
      <div style="font-size:48px">📸</div>
      <div style="font-size:20px;font-weight:800;color:#F1F5F9">FairScan</div>
      <div style="width:40px;height:3px;border-radius:2px;background:#1E293B;overflow:hidden;position:relative">
        <div style="position:absolute;width:60%;height:100%;background:#FF6B35;border-radius:2px;animation:loadSlide 1s ease-in-out infinite"></div>
      </div>
    </div>
    <style>@keyframes loadSlide{0%{left:-60%}100%{left:100%}}</style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
    <script>
      // Autocuración (17/09): el 09/09 quedó una versión rota guardada en algunos teléfonos, y un
      // teléfono que no se abrió en días puede arrancar con ella. Si a los 8 s la app no dibujó
      // nada, se dan de baja los service workers, se vacían los cachés y se recarga una sola vez.
      (function autocuracion() {
        try {
          if (sessionStorage.getItem('fs-autocuracion')) return;
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) return;
            sessionStorage.setItem('fs-autocuracion', '1');
            var limpiar = Promise.resolve();
            if (navigator.serviceWorker) limpiar = navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); });
            limpiar.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
              .catch(function () {}).then(function () { location.reload(); });
          }, 8000);
        } catch (e) {}
      })();
    </script>
  </body>
</html>
