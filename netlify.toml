[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pieza 2.7b · migración de fotos viejas a nombres inadivinables. Corre sola cada
# 2 minutos en tandas cortas. SE SACA cuando la migración termine (ver ClickUp 2.7b).
[functions."migrar-fotos-viejas"]
  schedule = "*/2 * * * *"

[[redirects]]
  from = "/api/process-image"
  to = "/.netlify/functions/process-image"
  status = 200

[[redirects]]
  from = "/api/process-audio"
  to = "/.netlify/functions/process-audio"
  status = 200

[[redirects]]
  from = "/api/process-card"
  to = "/.netlify/functions/process-card"
  status = 200

[[redirects]]
  from = "/api/upload-photo"
  to = "/.netlify/functions/upload-photo"
  status = 200

[[redirects]]
  from = "/api/proxy-image"
  to = "/.netlify/functions/proxy-image"
  status = 200

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Páginas legales estáticas (pieza 10.0). Tienen que ir ANTES del catch-all de abajo,
# si no la app se queda con la ruta y las páginas nunca se ven.
[[redirects]]
  from = "/privacidad"
  to = "/privacidad/index.html"
  status = 200

[[redirects]]
  from = "/terminos"
  to = "/terminos/index.html"
  status = 200

[[redirects]]
  from = "/soporte"
  to = "/soporte/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
